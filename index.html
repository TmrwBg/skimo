<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1A24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Skimo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Skimo</title>
<style>
@font-face{font-family:'BC';src:local('Helvetica Neue Condensed Bold'),local('Arial Narrow Bold');font-weight:700}
:root{
 --ink:#0F1A24;--panel:#17242F;--panel2:#1E2E3B;--line:#2A3D4D;
 --snow:#E9F1F6;--haze:#8AA2B4;--beacon:#F5C147;--done:#57A98B;--cold:#7FA8C9;--warn:#E2825A;
 --tap:52px;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink)}
body{font:400 16px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--snow);
 padding:var(--sat) 0 calc(96px + var(--sab));max-width:560px;margin:0 auto;-webkit-font-smoothing:antialiased}
.cond,h1,h2,h3{font-family:'Avenir Next Condensed','Helvetica Neue',sans-serif;letter-spacing:.01em}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--beacon);outline-offset:2px;border-radius:4px}
input{font:inherit;color:var(--snow);background:var(--panel2);border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;width:100%}
input:focus{outline:none;border-color:var(--beacon)}

.hdr{position:sticky;top:0;z-index:20;background:rgba(15,26,36,.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:var(--sat);margin-top:calc(-1 * var(--sat))}
.htop{display:flex;align-items:baseline;justify-content:space-between;padding:13px 16px 6px}
.wk{font-family:'Avenir Next Condensed',sans-serif;font-size:33px;font-weight:700;line-height:.9}
.wk span{font-size:14px;color:var(--haze);font-weight:500;margin-left:6px}
.blk{font-size:13px;color:var(--haze)}
.phase{font-size:12.5px;color:var(--beacon);padding:0 16px 9px;font-weight:500}
.phase.dl{color:var(--cold)}
.elev{display:flex;align-items:flex-end;gap:3px;height:40px;padding:0 16px 12px}
.pk{flex:1;border-radius:2px 2px 0 0;background:var(--panel2);position:relative}
.pk.past{background:#33505F}.pk.on{background:var(--beacon)}
.pk.dl{border:1px dashed var(--line)}.pk.dl.on{background:var(--cold);border:none}
.pk b{position:absolute;inset:auto 0 -13px;text-align:center;font:500 9px sans-serif;color:var(--haze)}
.pk.on b{color:var(--snow)}
.days{display:flex;padding:6px 10px 0}
.day{flex:1;padding:7px 2px 9px;text-align:center;border-bottom:2px solid transparent}
.day .d{font-family:'Avenir Next Condensed',sans-serif;font-size:14px;font-weight:600;color:var(--haze)}
.day .t{font-size:9.5px;color:#5E7A8C}
.day.sel{border-bottom-color:var(--beacon)}.day.sel .d{color:var(--snow)}
.day.opt .d{color:#4E6A7C}
.dot{width:5px;height:5px;border-radius:50%;background:var(--done);margin:3px auto 0}

.sess{padding:17px 16px 0}
.sh{display:flex;align-items:baseline;justify-content:space-between}
.sh h2{font-size:23px;font-weight:600;margin:0}
.sh .mins{font-size:14px;color:var(--haze)}
.ssub{font-size:12.5px;color:var(--haze);margin:2px 0 15px}

.ex{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:10px}
.ex.cur{border-color:var(--beacon)}.ex.fin{opacity:.5}
.eh{display:flex;justify-content:space-between;gap:10px;margin-bottom:9px}
.en{font-family:'Avenir Next Condensed',sans-serif;font-size:19px;font-weight:600;line-height:1.15}
.en small{display:block;font-family:inherit;font-size:11px;color:var(--haze);font-weight:400;margin-top:2px}
.ld{text-align:right;flex-shrink:0}
.ld b{font-family:'Avenir Next Condensed',sans-serif;font-size:25px;font-weight:700;line-height:1;display:block}
.ld u{display:block;font-size:10px;color:var(--haze);text-decoration:none;margin-top:1px}
.ld.auto b{font-size:13px;color:var(--beacon);max-width:120px;line-height:1.25}
.adj{font-size:10px;color:var(--cold);margin-top:2px}
.meta{display:flex;gap:14px;font-size:13px;color:var(--haze);margin-bottom:11px}
.meta b{color:var(--snow);font-weight:600}
.pips{display:flex;gap:7px}
.pip{flex:1;min-width:44px;max-width:88px;height:var(--tap);border:1.5px solid var(--line);border-radius:8px;
 font-family:'Avenir Next Condensed',sans-serif;font-size:18px;font-weight:600;color:var(--haze);
 display:flex;align-items:center;justify-content:center}
.pip.on{background:var(--done);border-color:var(--done);color:#0B1A14}
.pip:active{transform:scale(.95)}

.eff{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
.eff p{margin:0 0 8px;font-size:11.5px;color:var(--haze)}
.effb{display:flex;gap:6px}
.eb{flex:1;height:46px;border:1.5px solid var(--line);border-radius:8px;font-size:11px;font-weight:500;
 color:var(--haze);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.15;text-align:center}
.eb b{font-size:14px;font-weight:600}
.eb.on{border-color:var(--beacon);background:rgba(245,193,71,.13);color:var(--beacon)}
.eb.on.warnc{border-color:var(--warn);background:rgba(226,130,90,.13);color:var(--warn)}

.ss{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.sst{font-size:12px;color:var(--haze);line-height:1.3}
.sst b{display:block;color:var(--snow);font-family:'Avenir Next Condensed',sans-serif;font-size:15px;font-weight:600}
.ssb{min-width:44px;height:44px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;font-weight:600;
 color:var(--haze);display:flex;align-items:center;justify-content:center}
.ssb.on{background:var(--done);border-color:var(--done);color:#0B1A14}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:10px}
.card.cur{border-color:var(--beacon)}
.big{display:flex;align-items:baseline;gap:8px}
.big b{font-family:'Avenir Next Condensed',sans-serif;font-size:42px;font-weight:700;line-height:.95}
.big span{font-size:16px;color:var(--haze)}
.hrp{display:inline-flex;align-items:baseline;gap:5px;background:var(--panel2);border-radius:6px;padding:5px 9px;margin:9px 0 11px}
.hrp b{font-family:'Avenir Next Condensed',sans-serif;font-size:17px;font-weight:600;color:var(--cold)}
.hrp span{font-size:11px;color:var(--haze)}
.struct{font-size:13.5px;color:#C4D4DE;line-height:1.5}
.struct em{display:block;color:var(--haze);font-style:normal;font-size:12px;margin-top:7px}
.flds{display:flex;gap:8px;margin-top:13px}
.fld{flex:1;min-width:0}
.fld label{display:block;font-size:10.5px;color:var(--haze);margin-bottom:5px;white-space:nowrap}
.fld input{padding:11px 8px;text-align:center;font-size:17px;font-weight:600}
.flag{margin-top:10px;padding:9px 11px;background:rgba(226,130,90,.12);border:1px solid rgba(226,130,90,.35);
 border-radius:8px;font-size:11.5px;color:var(--warn);line-height:1.4}
.mark{width:100%;height:var(--tap);border:1.5px solid var(--line);border-radius:8px;font-family:'Avenir Next Condensed',sans-serif;
 font-size:16px;font-weight:600;color:var(--haze);margin-top:12px;display:flex;align-items:center;justify-content:center}
.mark.on{background:var(--done);border-color:var(--done);color:#0B1A14}

.tst{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:10px}
.th{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tl{font-family:'Avenir Next Condensed',sans-serif;font-size:18px;font-weight:600}
.tl i{font-style:normal;font-size:10px;color:var(--haze);font-weight:400}
.tload{font-family:'Avenir Next Condensed',sans-serif;font-size:22px;font-weight:700;color:var(--beacon);flex-shrink:0}
.tload u{font-size:10px;color:var(--haze);text-decoration:none}
.thint{font-size:11.5px;color:var(--haze);margin:5px 0 10px;line-height:1.4}
.tin{display:flex;align-items:center;gap:9px}
.tin input{text-align:center;font-size:19px;font-weight:600;padding:11px 8px}
.tin span{font-size:12px;color:var(--haze);min-width:38px}
.vd{background:var(--panel);border:1px solid var(--beacon);border-radius:10px;padding:15px;margin-top:16px}
.vd h3{font-family:'Avenir Next Condensed',sans-serif;font-size:18px;margin:0 0 7px;color:var(--beacon);font-weight:600}
.vwhy{font-size:13.5px;line-height:1.5;margin:0 0 11px}
.vnum{font-size:12px;color:var(--haze);line-height:1.7;border-top:1px dashed var(--line);padding-top:9px}
.vpick{margin-top:12px}
.vpick p{font-size:11px;color:var(--haze);margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em}
.vchips{display:flex;flex-wrap:wrap;gap:7px}
.vc{border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--haze);
 min-height:44px;display:flex;align-items:center;gap:6px;flex:1 1 46%}
.vc i{font-style:normal;font-size:9px;color:var(--beacon);border:1px solid var(--beacon);border-radius:3px;padding:1px 4px}
.vc.on{border-color:var(--beacon);background:rgba(245,193,71,.13);color:var(--snow)}
.vdesc{margin-top:11px;font-size:12.5px;color:#C4D4DE;line-height:1.5}
.editbtn{width:100%;min-height:46px;border:1.5px dashed var(--line);border-radius:8px;
 font-size:13px;color:var(--haze);display:flex;align-items:center;justify-content:center;margin-top:4px}
.edone{border:1.5px solid var(--line);border-radius:7px;padding:8px 14px;font-size:13px;color:var(--snow)}
.ed{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:10px}
.edh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.edb{display:flex;gap:6px;flex-shrink:0}
.eb2{width:44px;height:44px;border:1.5px solid var(--line);border-radius:7px;font-size:15px;color:var(--haze);
 display:flex;align-items:center;justify-content:center}
.eb2.rm{color:var(--warn);border-color:rgba(226,130,90,.4)}
.edf{display:flex;gap:8px;margin-bottom:10px}
.ef{flex:1;min-width:0}
.ef label{display:block;font-size:10.5px;color:var(--haze);margin-bottom:5px}
.ef input{text-align:center;font-size:16px;font-weight:600;padding:10px 6px}
.swp{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;color:var(--haze);
 display:flex;align-items:center;justify-content:center}
.addx{width:100%;min-height:48px;border:1.5px dashed var(--beacon);border-radius:8px;font-size:14px;
 color:var(--beacon);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.fwd{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;
 color:var(--haze);display:flex;align-items:center;justify-content:center;text-align:center;padding:0 12px}
.pick{margin-top:11px;border-top:1px dashed var(--line);padding-top:11px;max-height:320px;overflow-y:auto}
.pkh{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--haze);
 text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.pkx{font-size:12px;color:var(--haze);text-decoration:underline;text-transform:none;letter-spacing:0}
.pknote{font-size:11px;color:var(--haze);margin:0 0 9px;line-height:1.4}
.pkg{font-size:10px;color:#5E7A8C;text-transform:uppercase;letter-spacing:.07em;margin:10px 0 5px}
.pki{width:100%;min-height:44px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;color:var(--snow);
 display:flex;align-items:center;padding:0 12px;margin-bottom:5px}
.pki.cust{color:var(--beacon);border-style:dashed;margin-top:10px}
.gen{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px;margin-top:14px}
.gen h3{font-family:'Avenir Next Condensed',sans-serif;font-size:17px;margin:0 0 11px;font-weight:600}
.gmode{display:flex;gap:7px;margin-bottom:12px}
.gm{flex:1;border:1.5px solid var(--line);border-radius:8px;padding:10px;font-size:12.5px;color:var(--haze);
 min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.gm i{font-style:normal;font-size:10px;color:#5E7A8C}
.gm.on{border-color:var(--beacon);background:rgba(245,193,71,.13);color:var(--snow)}
.glab{font-size:11px;color:var(--haze);margin:0 0 7px;text-transform:uppercase;letter-spacing:.06em}
.gdays{display:flex;gap:5px;margin-bottom:10px}
.gd{flex:1;min-height:44px;border:1.5px solid var(--line);border-radius:7px;font-size:12px;color:var(--haze);
 display:flex;align-items:center;justify-content:center}
.gd.on{border-color:var(--done);background:rgba(87,169,139,.16);color:var(--snow)}
.gprev{font-size:12px;color:#C4D4DE;line-height:1.5;margin-bottom:11px}
.gbtn{width:100%;min-height:var(--tap);border-radius:8px;background:var(--beacon);color:#12202B;
 font-family:'Avenir Next Condensed',sans-serif;font-size:16px;font-weight:700;
 display:flex;align-items:center;justify-content:center}
.gbtn.off{background:var(--panel2);color:#5E7A8C;border:1.5px solid var(--line)}
.gwarn{font-size:11px;color:var(--haze);margin:9px 0 0;line-height:1.4;text-align:center}
.off{text-align:center;padding:46px 22px}
.off h2{font-family:'Avenir Next Condensed',sans-serif;font-size:25px;margin:0 0 8px;font-weight:600}
.off p{color:var(--haze);font-size:13.5px;margin:0;line-height:1.55}

.sum{margin-top:16px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.sum h3{font-size:14px;margin:0 0 9px;color:var(--haze);font-weight:600}
.sr{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid rgba(42,61,77,.5)}
.sr:last-child{border:none}
.sr b{font-family:'Avenir Next Condensed',sans-serif;font-size:15px;font-weight:600}

.tmr{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:560px;margin:0 auto;background:var(--panel2);
 border-top:1px solid var(--line);padding:11px 16px calc(11px + var(--sab));display:flex;align-items:center;gap:13px;
 transform:translateY(115%);transition:transform .22s}
.tmr.up{transform:none}
.tmr .cd{font-family:'Avenir Next Condensed',sans-serif;font-size:31px;font-weight:700;min-width:72px}
.tmr .cd.z{color:var(--beacon)}
.tmr .lb{flex:1;font-size:12px;color:var(--haze)}
.tmr button{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:12px 15px;min-height:44px;font-size:13px;font-weight:600}

.foot{padding:24px 16px 10px;display:flex;flex-direction:column;gap:10px;align-items:center}
.foot button{font-size:12px;color:#6E8A9C;text-decoration:underline}
.toast{position:fixed;left:50%;bottom:calc(80px + var(--sab));transform:translateX(-50%) translateY(20px);background:var(--panel2);
 border:1px solid var(--line);border-radius:8px;padding:10px 16px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:40}
.toast.up{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="tmr" id="tmr"><div class="cd" id="cd">2:30</div><div class="lb" id="tlb">Rest</div><button onclick="stopT()">Dismiss</button></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   1. PROGRAM SPEC  — this is DATA. Edit here to change the plan.
   ============================================================ */
const SPEC = {
 version: 1,
 block: 1,
 // Exercise library. `pattern` lets the app warn you when a swap
 // removes the last squat/hinge/pull, and lets it offer substitutes.
 lib: {
  squat:{n:'Back squat',pattern:'squat',inc:2.5,sub:['Front squat','Hack squat','Leg press']},
  bench:{n:'Bench press',pattern:'push',inc:2.5,sub:['DB bench press','Machine chest press']},
  bss:{n:'Bulgarian split squat',pattern:'unilateral',inc:2.5,sub:['Walking lunge','Reverse lunge'],note:'per leg · dumbbells'},
  pull:{n:'Lat pulldown',pattern:'pull',inc:2.5,sub:['Pull-up','Assisted pull-up'],note:'or pull-up'},
  rdl:{n:'Romanian deadlift',pattern:'hinge',inc:2.5,sub:['Trap-bar RDL','Cable RDL']},
  legp:{n:'Leg press',pattern:'squat',inc:5,sub:['Hack squat','Goblet squat'],note:'find your own load'},
  benchv:{n:'Bench press',pattern:'push',inc:2.5,sub:['DB bench press'],note:'volume day'},
  row:{n:'Chest-supported row',pattern:'pull',inc:2.5,sub:['Seated cable row','DB row']},
  calf:{n:'Calf raise',pattern:'calf'},
  hkr:{n:'Hanging knee raise',pattern:'trunk'},
  lat:{n:'Lateral raise',pattern:'push'},
  trunk:{n:'Weighted trunk',pattern:'trunk'}
 },
 // Weekly schedules. load = baseline prescription; the engine adds
 // your accumulated adjustment on top (see section 2).
 sched:{
  squat:[[45,3,6,3],[47.5,3,6,3],[50,4,6,2],[52.5,4,5,2],[55,4,5,2],[57.5,4,4,1.5],[60,4,4,1],[45,2,5,4.5]],
  bench:[[35,3,8,3],[35,3,9,3],[37.5,4,8,2],[37.5,4,8,2],[40,4,7,2],[40,4,6,1.5],[42.5,4,6,1],[32.5,2,8,4.5]],
  bss:[[10,3,'8-10',2.5],[10,3,'8-10',2.5],[10,3,'8-10',2.5],[12.5,3,'8-10',2.5],[12.5,3,'10-12',1.5],[12.5,3,'10-12',1.5],[15,3,'10-12',1.5],[10,2,8,4]],
  pull:[[45,3,6,2.5],[45,3,7,2.5],[45,3,8,2.5],[47.5,3,7,2.5],[47.5,3,8,2.5],[50,3,7,2],[50,3,8,2],[40,2,8,4]],
  rdl:[[45,3,8,3],[45,3,9,3],[50,3,8,2],[50,4,8,2],[55,4,8,2],[57.5,4,7,1.5],[60,4,6,1],[45,2,8,4.5]],
  legp:[[null,3,10,3],[null,3,11,3],[null,3,12,2],[null,3,10,2],[null,3,11,2],[null,3,12,1.5],[null,4,'8-10',1],[null,2,10,4]],
  benchv:[[32.5,3,10,3],[32.5,3,11,3],[32.5,4,10,2],[35,4,9,2],[35,4,9,2],[37.5,4,8,1.5],[37.5,4,8,1],[30,2,8,4.5]],
  row:[[40,3,8,2.5],[40,3,9,2.5],[40,3,10,2.5],[42.5,3,9,2.5],[42.5,3,10,2.5],[45,3,9,2],[45,3,10,2],[35,2,8,4]],
  calf:[[3,'10-15'],[3,'10-15'],[3,'12-15'],[3,'12-15'],[3,15],[3,15],[3,15],[2,10]],
  hkr:[[2,'8-12'],[2,'8-12'],[2,'10-12'],[2,'10-12'],[2,12],[2,12],[2,12],[2,8]],
  lat:[[2,'12-20'],[2,'12-20'],[2,'15-20'],[2,'15-20'],[2,'15-20'],[2,'18-20'],[2,'18-20'],[2,12]],
  trunk:[[2,'8-12'],[2,'8-12'],[2,'10-12'],[2,'10-12'],[2,'10-12'],[2,12],[2,12],[2,8]]
 },
 // Day templates. dow 0=Mon. Edit slots to add/remove exercises.
 days:[
  {dow:0,type:'strength',title:'Strength A',sub:'Squat focus · morning',mins:'~55 min',
   slots:[{ex:'squat',rule:'linear-rir',rest:150},
          {ex:'bench',rule:'linear-rir',rest:150,ss:'hkr'},
          {ex:'bss',rule:'linear-rir',rest:75,ss:'calf'},
          {ex:'pull',rule:'linear-rir',rest:75}]},
  {dow:1,type:'aerobic',title:'Aerobic'},
  {dow:2,type:'strength',title:'Strength B',sub:'Hinge + quad focus · morning',mins:'~55 min',
   slots:[{ex:'rdl',rule:'linear-rir',rest:150},
          {ex:'legp',rule:'autoregulated',rest:120},
          {ex:'benchv',rule:'linear-rir',rest:120,ss:'lat'},
          {ex:'row',rule:'linear-rir',rest:75,ss:'trunk'}]},
  {dow:3,type:'aerobic',title:'Aerobic'},
  {dow:4,type:'me',title:'Muscular endurance'},

/* ============================================================
   2. PROGRESSION ENGINE — pure functions. spec + log → today.
   ============================================================
   Your effort tap after the last set moves `adj` (a kg offset that
   rides on top of the baseline schedule and carries forward).      */
const EFFORT = {
 more:{lb:'Had more',sym:'▲',d:'up'},
 ok:{lb:'On target',sym:'●',d:'hold'},
 hard:{lb:'Grindy',sym:'▼',d:'stay'},
 miss:{lb:'Missed reps',sym:'✕',d:'down'}
};

function applyEffort(exId,week,effort){
 const sc=SPEC.sched[exId]; if(!sc) return;
 const inc=SPEC.lib[exId].inc||2.5;
 const cur=sc[week-1], nxt=sc[week]||cur;
 let a=LOG.adj[exId]||0;
 const step=(nxt[0]||0)-(cur[0]||0);
 if(effort==='more') a+=inc;
 else if(effort==='hard') a-=step;                       // cancel next week's jump: repeat this load
 else if(effort==='miss'){                               // drop below what you just failed
  const base=(cur[0]||0)+a;
  a-=step+Math.max(inc,Math.round(base*.06/inc)*inc);
 }
 LOG.adj[exId]=a;
}

function prescribe(slot,week){
 const ex=SPEC.lib[slot.ex], sc=SPEC.sched[slot.ex], b=sc[week-1];
 if(slot.rule==='autoregulated'){
  const last=LOG.auto[slot.ex];
  return {name:ex.n,note:ex.note,auto:true,last,sets:b[1],reps:b[2],rir:b[3],rest:slot.rest};
 }
 const adj=LOG.adj[slot.ex]||0;
 return {name:ex.n,note:ex.note,load:Math.max(0,(b[0]||0)+adj),adj,sets:b[1],reps:b[2],rir:b[3],rest:slot.rest};
}
function prescribeSS(id,week){const b=SPEC.sched[id][week-1];return {name:SPEC.lib[id].n,sets:b[0],reps:b[1]};}

function nextAutoLoad(exId,effort){
 const last=LOG.auto[exId]; if(!last) return;
 const inc=SPEC.lib[exId].inc||5;
 if(effort==='more') LOG.auto[exId]=last+inc;
 else if(effort==='miss') LOG.auto[exId]=Math.round(last*.93/inc)*inc;
}

   2b. WEEK-8 TESTING + VERDICT
   ============================================================
   Test loads are computed from your ACTUAL week-7 load (baseline
   plus whatever you autoregulated to), not the printed plan, so
   the test stays valid however far you drifted.                  */
const TESTS=[
 {id:'sqA',lb:'Squat AMRAP',u:'reps',ex:'squat',hint:'Warm up as normal, then one all-out set stopped at ~1 RIR.'},
 {id:'bpA',lb:'Bench AMRAP',u:'reps',ex:'bench',hint:'Same method — stop with about one rep left.'},
 {id:'aet',lb:'AeT retest',u:'bpm',hint:'Repeat the Uphill Athlete test under matching conditions.'},
 {id:'meSp',lb:'ME retest speed',u:'km/h',hint:"Repeat week 5's session: 8 min at 12-15% incline, ~10 kg. Log the speed you held."},
 {id:'sp110',lb:'Speed at 110 bpm',u:'km/h',hint:'Treadmill at your usual incline. Settle at 110 bpm, record the speed.'},
 {id:'drift',lb:'HR drift',u:'bpm',opt:1,hint:'Last 20 min average minus first 20 min, on a long Zone 2 session. Optional — leave blank to skip.'},
 {id:'bw',lb:'Bodyweight',u:'kg',hint:'Same conditions as your usual weigh-ins.'},
 {id:'fat',lb:'Fatigue',u:'1-10',hint:'1 = fresh and motivated. 10 = wrecked.'}

const BRANCH={
 me:{t:'ME emphasis',d:'Hold strength at maintenance. Shift the third quality session and more of the aerobic volume toward specific uphill muscular endurance.'},
 strength:{t:'Strength emphasis',d:'Repeat a structure like block 1, with starting loads reset from your tested maxes. Aerobic at maintenance, ME kept light.'},
 specific:{t:'Ski-mountaineering specificity',d:'Blend strength, ME and aerobic into longer specific sessions — loaded uphill carries, longer continuous vertical.'},
 recovery:{t:'Recovery block',d:'One to two weeks of reduced volume and intensity before resuming progressive loading. Reassess sleep, food and life stress first.'}
};
const e1rm=(load,reps)=>load*(1+reps/30);

function testLoad(ex){
 const b=SPEC.sched[ex][6];                       // week 7
 const load=(b[0]||0)+(LOG.adj[ex]||0);
 const cap=(+String(b[2]).split('-')[0])+b[3];    // reps you could have done
 const inc=SPEC.lib[ex].inc||2.5;
 return Math.max(inc,Math.round(e1rm(load,cap)*.85/inc)*inc);  // aims at a 5-7 rep set
}
function testedMax(ex){
 const reps=(LOG.tests||{})[ex==='squat'?'sqA':'bpA'];
 if(!reps) return null;
 return e1rm(testLoad(ex),+reps+1);               // +1 because you stopped at 1 RIR
}
function strengthGain(ex){
 const m=testedMax(ex),b=SPEC.baseline[ex];
 return m&&b?{now:m,was:b,pct:(m-b)/b*100}:null;
}
// Pull logged cardio for a set of weeks. Only sessions with speed AND HR count.
function aeroSet(weeks){
 const out=[];
 for(const k in LOG.cardio){
  const c=LOG.cardio[k],w=+k.split('-')[0],d=+k.split('-')[1];
  if(weeks.indexOf(w)>-1&&d!==4&&c.sp&&c.hr)out.push(c);      // exclude Friday ME
 }
 if(!out.length)return null;
 const avg=f=>out.reduce((a,c)=>a+(c[f]||0),0)/out.length;
 return {n:out.length,sp:avg('sp'),hr:avg('hr'),in:avg('in')};
}
function aeroCompare(){
 const a=aeroSet([1,2]),b=aeroSet([6,7]);
 if(!a||!b)return {ok:0,why:'Not enough logged aerobic sessions to compare. Needs speed and HR in weeks 1-2 and 6-7.'};
 if(Math.abs(a.in-b.in)>1.5)
  return {ok:0,why:'Early and late sessions ran at different inclines ('+a.in.toFixed(1)+'% vs '+b.in.toFixed(1)+'%), so the speeds are not comparable.',a,b};
 const faster=b.sp-a.sp, hrUp=b.hr-a.hr;
 return {ok:1,a,b,faster,hrUp,improved:faster>.1&&hrUp<=2};
}
function verdict(){
 const T=LOG.tests||{},R=[],neg=[];
 const sq=strengthGain('squat'),bp=strengthGain('bench');
 const gains=[sq,bp].filter(Boolean).map(g=>g.pct);
 const sGain=gains.length?gains.reduce((a,b)=>a+b,0)/gains.length:null;   // average, so one good lift can't mask a stalled one
 const unrel=r=>r>12?' — estimate unreliable above 12 reps':'';
 if(sq)R.push('Squat '+sq.was+' → '+sq.now.toFixed(1)+' kg ('+(sq.pct>=0?'+':'')+sq.pct.toFixed(1)+'%)'+unrel(+T.sqA));
 if(bp)R.push('Bench '+bp.was+' → '+bp.now.toFixed(1)+' kg ('+(bp.pct>=0?'+':'')+bp.pct.toFixed(1)+'%)'+unrel(+T.bpA));
 if(sGain!=null&&gains.length>1)R.push('Average strength gain '+(sGain>=0?'+':'')+sGain.toFixed(1)+'%');
 const ae=aeroCompare();
 if(ae.ok)R.push('Aerobic '+ae.a.sp.toFixed(1)+' → '+ae.b.sp.toFixed(1)+' km/h at '+ae.a.hr.toFixed(0)+' → '+ae.b.hr.toFixed(0)+' bpm');
 else R.push(ae.why);
 // ME: week-8 retest speed vs the week-5 session it replicates
 const w5=LOG.cardio['5-4-card-0'];
 let meImp=null;
 if(T.meSp&&w5&&w5.sp){meImp=T.meSp-w5.sp;R.push('ME '+w5.sp.toFixed(1)+' → '+(+T.meSp).toFixed(1)+' km/h at matched incline and load');}
 if(T.drift!=null&&T.drift!=='')R.push('HR drift '+T.drift+' bpm');
 // negative signals
 if(+T.fat>=7)neg.push('fatigue rated '+T.fat+'/10');
 if(sGain!=null&&sGain<0)neg.push('strength below baseline');
 if(ae.ok&&ae.faster<-.1)neg.push('aerobic speed declined');
 if(meImp!=null&&meImp<-.2)neg.push('ME slower than week 5');
 if(+T.drift>=8)neg.push('high HR drift');
 if(T.bw&&T.bw<SPEC.baseline.bw-1.5)neg.push('bodyweight down '+(SPEC.baseline.bw-T.bw).toFixed(1)+' kg');

 const sStrong=sGain!=null&&sGain>=8, sWeak=sGain!=null&&sGain<4;   // 8wk block should yield ~10-15%
 const aStrong=ae.ok&&ae.improved, meStrong=meImp!=null&&meImp>0;
 let br,why;
 if(neg.length>=2){br='recovery';why='Two or more warning signs: '+neg.join(', ')+'.';}
 else if(sStrong&&meImp!=null&&!meStrong){br='me';why='Strength moved well but ME did not — endurance is now the limiter.';}
 else if(sWeak&&aStrong){br='strength';why='Aerobic improved while strength stalled — the force ceiling needs the attention.';}
 else if(sStrong&&(aStrong||meStrong)){br='specific';why='Strength and endurance both moved. Time to make the work more specific.';}
 else if(sStrong){br='me';why='Strength moved well. ME is the least developed piece and your second priority.';}
 else {br='me';why='Results are mixed, so this defaults to ME — the piece block 1 deliberately under-developed.';}
 return {br,why,R,neg,sGain,ae,meImp,done:TESTS.filter(t=>!t.opt&&T[t.id]!=null&&T[t.id]!=='').length};
}

/* ============================================================
   2c. BLOCK GENERATOR — turns a verdict into the next 8 weeks.
   ============================================================
   Loads scale off tested maxes (squat/bench) or off whatever you
   autoregulated to (everything else). Aerobic holds at ~8 h/week
   by decision — block 1 already climbed 6.0 → 7.9 h.            */
const PROFILE={
 strength:{f:1.00,flat:0,capSets:0,me:[35,40,40,45,45,50,50,30],
  ph:'Force ceiling · ME held light',aero:{pm:85,total:480,dlTotal:90}},
 me:{f:0.85,flat:1,capSets:3,me:[60,65,70,70,75,80,85,35],
  ph:'ME progression · strength maintained',aero:{pm:85,total:480,dlTotal:90}},
 specific:{f:0.95,flat:0,capSets:0,me:[55,60,65,70,75,80,90,35],
  ph:'Ski-mountaineering specificity',aero:{pm:85,total:480,dlTotal:90}},
 recovery:{f:0.82,flat:0,capSets:3,me:[30,30,35,35,40,40,45,25],
  ph:'Recovery · rebuild conservatively',aero:{pm:60,total:360,dlTotal:80}}
};
function scaleFor(ex){
 if(ex==='squat'){const m=testedMax('squat');if(m)return m/SPEC.baseline.squat;}
 if(ex==='bench'||ex==='benchv'){const m=testedMax('bench');if(m)return m/SPEC.baseline.bench;}
 const b=SPEC.sched[ex][6][0];
 return b?1+((LOG.adj[ex]||0)/b):1;                  // carry your autoregulated drift
}
function genSched(branch){
 const P=PROFILE[branch],out={};
 for(const ex in SPEC.sched){
  const rows=SPEC.sched[ex],inc=(SPEC.lib[ex]||{}).inc||2.5,sc=scaleFor(ex);
  if(rows[0].length<3){out[ex]=rows.map(r=>r.slice());continue;}   // sets/reps-only accessories
  const peak=(rows[6][0]||0)*sc*P.f;
  out[ex]=rows.map((r,w)=>{
   const nr=r.slice(),dl=(w===7);
   if(r[0]!=null){
    // flat profiles hold one maintenance load, but week 8 still deloads
    const raw=P.flat?(dl?peak*.75:peak):(r[0]*sc*P.f);
    nr[0]=Math.max(inc,Math.round(raw/inc)*inc);
   }
   if(P.flat&&nr.length>3&&!dl)nr[3]=2;        // constant load ⇒ constant target effort
   if(P.capSets&&nr[1]>P.capSets)nr[1]=P.capSets;
   return nr;});
 }
 return out;
}
// Weekly aerobic budget divided across the aerobic days actually chosen,
// so adding a sixth day makes each session shorter rather than adding hours.
function aeroPlan(branch,nAero,nStr){
 const P=PROFILE[branch].aero,n=Math.max(1,nAero);
 return {pm:P.pm,
  per:Math.round((P.total-P.pm*nStr)/n/5)*5,
  dl:Math.round(P.dlTotal/n/5)*5};
}
function genDays(sel,branch){
 const n=sel.length,sA=0,sB=Math.floor(n/2),meI=n-1;
 const nAero=n-3;                                   // 2 strength + 1 ME, rest aerobic
 const A=aeroPlan(branch,nAero,2);
 const arr=v=>Array.from({length:8},(_,i)=>i===7?A.dl:v);
 const pmA=()=>Array.from({length:8},(_,i)=>i===7?0:A.pm);
 const base=SPEC.days.filter(x=>x.type==='strength');
 return Array.from({length:7},(_,d)=>{
  const pos=sel.indexOf(d);
  if(pos<0)return{dow:d,type:'off'};
  if(pos===sA||pos===sB){const src=base[pos===sA?0:1]||base[0];
   return{dow:d,type:'strength',title:src.title,sub:src.sub,mins:src.mins,
          slots:src.slots.map(x=>Object.assign({},x)),pm:pmA()};}
  if(pos===meI)return{dow:d,type:'me',title:'Muscular endurance'};
  return{dow:d,type:'aerobic',title:'Aerobic',mins:arr(A.per)};
 });
}

function dayOf(d){return SPEC.days.find(x=>x.dow===d);}
function dayDone(w,d){const t=dayOf(d);
 if(t.type==='off')return false;
 if(t.type!=='strength')return on(K(w,d,'card',0));
 return t.slots.every(s=>{const p=prescribe(s,w);
  for(let i=0;i<p.sets;i++)if(!on(K(w,d,s.ex,i)))return false;
  if(s.ss){const q=prescribeSS(s.ss,w);for(let i=0;i<q.sets;i++)if(!on(K(w,d,s.ss,i)))return false;}
  return true;});}

// Day-driven so a regenerated block can put aerobic work on any day.
function aeroDays(){return SPEC.days.filter(x=>x.type==='aerobic').map(x=>x.dow);}
function aeroMins(d,i){const t=dayOf(d);if(t.mins)return t.mins[i];
 return (aeroDays().indexOf(d)===0?SPEC.tue:SPEC.thu)[i];}
function pmMins(d,i){const t=dayOf(d);return t.pm?t.pm[i]:(SPEC.pm?SPEC.pm[i]:0);}
function weekAero(i){let m=0;
 SPEC.days.forEach(t=>{if(t.type==='aerobic')m+=aeroMins(t.dow,i);
  if(t.type==='strength')m+=pmMins(t.dow,i);});
 return m/60;}
function cardioFor(w,d){const i=w-1,t=dayOf(d);
 if(t.type==='me'){const m=SPEC.me[i];return{mins:m.m,hr:m.hr,s:m.s,n:m.n,me:1};}
 const k=aeroDays().indexOf(d),last=k===aeroDays().length-1;
 return{mins:aeroMins(d,i),hr:i===7?'105-115':(k===0?'105-118':'108-118'),
  s:(last&&(i===5||i===6))?'Continuous Zone 1/2, finishing with ~20 min at 115-120 bpm.'
    :'Continuous Zone 1/2 — treadmill, stair machine or outdoors.',
  n:i===7?'Deload week. Keep it genuinely easy.'
    :'Progress by increasing speed at the same heart rate, not by raising incline.'};}

  const sel=LOG.genDays||SPEC.days.filter(t=>t.type!=='off').map(t=>t.dow);
  if(!confirm('Generate block '+((SPEC.block||1)+1)+' as '+BRANCH[br].t+'?\n\nBlock '+(SPEC.block||1)+' is archived and the current log clears.'))return;
  generate(br,mode,sel);
  LOG.genMode=null;LOG.genDays=null;save();render();
  toast('Block '+SPEC.block+' ready — week 1, day 1');});
 document.querySelectorAll('.vc').forEach(b=>b.onclick=()=>{
  LOG.branch=b.dataset.br;save();render();
  toast('Next block set to '+BRANCH[b.dataset.br].t.toLowerCase());});
 document.querySelectorAll('[data-c]').forEach(el=>el.onchange=()=>{
  const k=el.dataset.c;LOG.cardio[k]=LOG.cardio[k]||{};
  const v=parseFloat(el.value);
  if(isNaN(v))delete LOG.cardio[k][el.dataset.f];else LOG.cardio[k][el.dataset.f]=v;
  save();
  if(el.dataset.f==='hr')render();   // flag depends on this value
 });
}

function backup(){
 const blob=new Blob([JSON.stringify({app:'skimo',v:1,saved:new Date().toISOString(),log:LOG},null,1)],{type:'application/json'});
 const f=new File([blob],'skimo-backup-'+new Date().toISOString().slice(0,10)+'.json',{type:'application/json'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Skimo backup'}).catch(()=>{});return;}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name;a.click();
}
function restore(){
 const inp=document.createElement('input');inp.type='file';inp.accept='application/json';
 inp.onchange=()=>{const fr=new FileReader();
  fr.onload=()=>{try{const d=JSON.parse(fr.result);
   if(!d||!d.log||typeof d.log!=='object'||Array.isArray(d.log))throw 0;
   LOG=Object.assign(LOG,d.log);
   applySpec();                       // a block-2 backup must restore block 2's plan too
   save();render();
   toast('Restored — block '+(SPEC.block||1)+', week '+LOG.pos.w);}
   catch(e){toast("That file isn't a Skimo backup");}};
  fr.readAsText(inp.files[0]);};
 inp.click();
}
function wipe(){if(confirm('Clear every logged set, load adjustment and cardio entry?')){
 LOG={done:{},adj:{},auto:{},effort:{},base:{},cardio:{},tests:{},branch:null,spec:LOG.spec,history:LOG.history,pos:LOG.pos};save();render();toast('Progress cleared');}}

(async function(){
 const s=await dbGet('log');
 if(s)LOG=Object.assign(LOG,s);
 applySpec();
 render();
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
 try{if(navigator.wakeLock)document.addEventListener('click',async()=>{
  if(!window.__wl)window.__wl=await navigator.wakeLock.request('screen').catch(()=>null);},{once:true});}catch(e){}
})();
</script>
</body>
