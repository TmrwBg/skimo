<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1A24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Skimo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Skimo</title>
<style>
:root{
 --ink:#0F1A24;--panel:#17242F;--panel2:#1E2E3B;--line:#2A3D4D;
 --snow:#E9F1F6;--haze:#8AA2B4;--beacon:#F5C147;--done:#57A98B;--cold:#7FA8C9;--warn:#E2825A;
 --tap:52px;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink)}
body{font:400 16px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--snow);
 padding:var(--sat) 0 calc(96px + var(--sab));max-width:560px;margin:0 auto;-webkit-font-smoothing:antialiased}
.cond,h1,h2,h3{font-family:'Avenir Next Condensed','Helvetica Neue',sans-serif;letter-spacing:.01em}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--beacon);outline-offset:2px;border-radius:4px}
input,select{font:inherit;color:var(--snow);background:var(--panel2);border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;width:100%}
input:focus{outline:none;border-color:var(--beacon)}

.hdr{position:sticky;top:0;z-index:20;background:rgba(15,26,36,.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:var(--sat);margin-top:calc(-1 * var(--sat))}
.htop{display:flex;align-items:baseline;justify-content:space-between;padding:13px 16px 6px}
.wk{font-family:'Avenir Next Condensed',sans-serif;font-size:33px;font-weight:700;line-height:.9}
.wk span{font-size:14px;color:var(--haze);font-weight:500;margin-left:6px}
.blk{font-size:12.5px;color:var(--haze)}
.phase{font-size:12.5px;color:var(--beacon);padding:0 16px 9px;font-weight:500}
.phase.dl{color:var(--cold)}
.elev{display:flex;align-items:flex-end;gap:3px;height:40px;padding:0 16px 12px}
.pk{flex:1;border-radius:2px 2px 0 0;background:var(--panel2);position:relative}
.pk.past{background:#33505F}.pk.on{background:var(--beacon)}
.pk.dl{border:1px dashed var(--line)}.pk.dl.on{background:var(--cold);border:none}
.pk b{position:absolute;inset:auto 0 -13px;text-align:center;font:500 9px sans-serif;color:var(--haze)}
.pk.on b{color:var(--snow)}
.days{display:flex;padding:6px 10px 0}
.day{flex:1;padding:7px 2px 9px;text-align:center;border-bottom:2px solid transparent;position:relative}
.day .d{font-family:'Avenir Next Condensed',sans-serif;font-size:14px;font-weight:600;color:var(--haze)}
.day .t{font-size:9.5px;color:#5E7A8C}
.day.sel{border-bottom-color:var(--beacon)}.day.sel .d{color:var(--snow)}
.day.opt .d{color:#4E6A7C}
.dot{width:5px;height:5px;border-radius:50%;background:var(--done);margin:3px auto 0}
.tagdot{position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--warn)}

.sess{padding:17px 16px 0}
.sh{display:flex;align-items:baseline;justify-content:space-between}
.sh h2{font-size:23px;font-weight:600;margin:0}
.sh .mins{font-size:14px;color:var(--haze)}
.ssub{font-size:12.5px;color:var(--haze);margin:2px 0 15px}

.ex{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:10px}
.ex.cur{border-color:var(--beacon)}.ex.fin{opacity:.5}
.eh{display:flex;justify-content:space-between;gap:10px;margin-bottom:9px}
.en{font-family:'Avenir Next Condensed',sans-serif;font-size:19px;font-weight:600;line-height:1.15}
.en small{display:block;font-family:inherit;font-size:11px;color:var(--haze);font-weight:400;margin-top:2px}
.ld{text-align:right;flex-shrink:0}
.ld b{font-family:'Avenir Next Condensed',sans-serif;font-size:25px;font-weight:700;line-height:1;display:block}
.ld u{display:block;font-size:10px;color:var(--haze);text-decoration:none;margin-top:1px}
.ld.find b{font-size:13px;color:var(--beacon);max-width:120px;line-height:1.25}
.meta{display:flex;gap:14px;font-size:13px;color:var(--haze);margin-bottom:11px;flex-wrap:wrap}
.meta b{color:var(--snow);font-weight:600}
.tempo{color:var(--beacon)!important}
.hint{font-size:11px;color:var(--haze);line-height:1.4;margin:-2px 0 10px}
.pips{display:flex;gap:7px}
.pip{flex:1;min-width:44px;max-width:88px;height:var(--tap);border:1.5px solid var(--line);border-radius:8px;
 font-family:'Avenir Next Condensed',sans-serif;font-size:18px;font-weight:600;color:var(--haze);
 display:flex;align-items:center;justify-content:center}
.pip.on{background:var(--done);border-color:var(--done);color:#0B1A14}
.pip:active{transform:scale(.95)}

.eff{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
.eff p{margin:0 0 8px;font-size:11.5px;color:var(--haze)}
.effb{display:flex;gap:6px}
.eb{flex:1;height:46px;border:1.5px solid var(--line);border-radius:8px;font-size:11px;font-weight:500;
 color:var(--haze);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.15;text-align:center}
.eb b{font-size:14px;font-weight:600}
.eb.on{border-color:var(--beacon);background:rgba(245,193,71,.13);color:var(--beacon)}
.eb.on.warnc{border-color:var(--warn);background:rgba(226,130,90,.13);color:var(--warn)}

.dur{display:flex;justify-content:space-between;align-items:center;gap:10px;
 padding:9px 0;border-top:1px dashed var(--line)}
.ss{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.sst{font-size:12px;color:var(--haze);line-height:1.3}
.sst b{display:block;color:var(--snow);font-family:'Avenir Next Condensed',sans-serif;font-size:15px;font-weight:600}
.ssb{min-width:44px;height:44px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;font-weight:600;
 color:var(--haze);display:flex;align-items:center;justify-content:center}
.ssb.on{background:var(--done);border-color:var(--done);color:#0B1A14}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:10px}
.card.cur{border-color:var(--beacon)}
.big{display:flex;align-items:baseline;gap:8px}
.big b{font-family:'Avenir Next Condensed',sans-serif;font-size:42px;font-weight:700;line-height:.95}
.big span{font-size:16px;color:var(--haze)}
.hrp{display:inline-flex;align-items:baseline;gap:5px;background:var(--panel2);border-radius:6px;padding:5px 9px;margin:9px 8px 11px 0}
.hrp b{font-family:'Avenir Next Condensed',sans-serif;font-size:17px;font-weight:600;color:var(--cold)}
.hrp span{font-size:11px;color:var(--haze)}
.hrp.pack b{color:var(--beacon)}
.struct{font-size:13.5px;color:#C4D4DE;line-height:1.5}
.struct em{display:block;color:var(--haze);font-style:normal;font-size:12px;margin-top:7px}
.flds{display:flex;gap:8px;margin-top:13px}
.fld{flex:1;min-width:0}
.fld label{display:block;font-size:10.5px;color:var(--haze);margin-bottom:5px;white-space:nowrap}
.fld input{padding:11px 8px;text-align:center;font-size:17px;font-weight:600}
.mark{width:100%;height:var(--tap);border:1.5px solid var(--line);border-radius:8px;font-family:'Avenir Next Condensed',sans-serif;
 font-size:16px;font-weight:600;color:var(--haze);margin-top:12px;display:flex;align-items:center;justify-content:center}
.mark.on{background:var(--done);border-color:var(--done);color:#0B1A14}
.lim{display:flex;gap:7px;margin-top:12px}
.lm{flex:1;min-height:46px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;color:var(--haze);
 display:flex;align-items:center;justify-content:center;text-align:center}
.lm.on{border-color:var(--beacon);background:rgba(245,193,71,.13);color:var(--snow)}

.edone{border:1.5px solid var(--line);border-radius:8px;padding:10px 16px;min-height:44px;font-size:13px;
 color:var(--snow);display:flex;align-items:center;flex-shrink:0}
.editbtn{width:100%;min-height:46px;border:1.5px dashed var(--line);border-radius:8px;
 font-size:13px;color:var(--haze);display:flex;align-items:center;justify-content:center;margin-top:4px}
.ed{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:10px}
.edh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.edb{display:flex;gap:6px;flex-shrink:0}
.eb2{width:44px;height:44px;border:1.5px solid var(--line);border-radius:7px;font-size:15px;color:var(--haze);
 display:flex;align-items:center;justify-content:center}
.eb2.rm{color:var(--warn);border-color:rgba(226,130,90,.4)}
.edf{display:flex;gap:8px;margin-bottom:10px}
.ef{flex:1;min-width:0}
.ef label{display:block;font-size:10.5px;color:var(--haze);margin-bottom:5px}
.ef input{text-align:center;font-size:16px;font-weight:600;padding:10px 6px}
.swp{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;color:var(--haze);
 display:flex;align-items:center;justify-content:center}
.addx{width:100%;min-height:48px;border:1.5px dashed var(--beacon);border-radius:8px;font-size:14px;
 color:var(--beacon);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.fwd{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;
 color:var(--haze);display:flex;align-items:center;justify-content:center;text-align:center;padding:0 12px}
.pick{margin-top:11px;border-top:1px dashed var(--line);padding-top:11px;max-height:320px;overflow-y:auto}
.pkh{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--haze);
 text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.pkx{font-size:12px;color:var(--haze);text-decoration:underline;text-transform:none;letter-spacing:0;min-height:44px;display:flex;align-items:center}
.pknote{font-size:11px;color:var(--haze);margin:0 0 9px;line-height:1.4}
.pki{width:100%;min-height:44px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;color:var(--snow);
 display:flex;align-items:center;padding:0 12px;margin-bottom:5px}
.pki.cust{color:var(--beacon);border-style:dashed;margin-top:10px}
.gdays{display:flex;gap:5px;margin-bottom:10px}
.gd{flex:1;min-height:44px;border:1.5px solid var(--line);border-radius:7px;font-size:12px;color:var(--haze);
 display:flex;align-items:center;justify-content:center}
.gd.on{border-color:var(--done);background:rgba(87,169,139,.16);color:var(--snow)}
.gprev{font-size:12px;color:#C4D4DE;line-height:1.5}
.pri{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid rgba(42,61,77,.5)}
.pri:last-of-type{border:none}
.prn{width:26px;height:26px;border-radius:50%;background:var(--panel2);color:var(--haze);flex-shrink:0;
 display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.pri:not(.empty) .prn{background:var(--beacon);color:#12202B}
.prb{flex:1;min-width:0}
.prb b{display:block;font-family:'Avenir Next Condensed',sans-serif;font-size:16px;font-weight:600}
.prb b.ph{color:#4E6A7C}
.prb span{font-size:11px;color:var(--haze)}
.prx{font-size:11px;color:var(--haze);text-decoration:underline;flex-shrink:0;min-height:44px;display:flex;align-items:center;padding-left:8px}
.fo{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:7px;text-align:left;min-height:56px}
.fo.on{border-color:var(--beacon);background:rgba(245,193,71,.11)}
.fon{display:flex;align-items:center;gap:8px}
.fon b{font-family:'Avenir Next Condensed',sans-serif;font-size:16px;font-weight:600}
.fon i{font-style:normal;font-size:10px;background:var(--beacon);color:#12202B;border-radius:4px;padding:1px 6px;font-weight:700}
.fod{font-size:11.5px;color:var(--haze);line-height:1.4;margin-top:3px}
.ch{font-family:'Avenir Next Condensed',sans-serif;font-size:17px;font-weight:600;margin:0 0 10px}
.thg{display:flex;gap:9px}
.thv{flex:1;border:1.5px solid var(--line);border-radius:9px;padding:12px 10px;min-height:76px;
 display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;text-align:left}
.thv span{font-size:10.5px;color:var(--haze);text-transform:uppercase;letter-spacing:.05em}
.thv b{font-family:'Avenir Next Condensed',sans-serif;font-size:27px;font-weight:700;line-height:1}
.thv u{font-size:10px;color:var(--haze);text-decoration:none}
.thv.unset{border-style:dashed}.thv.unset b{font-size:16px;color:var(--beacon)}
.zt{width:100%;table-layout:fixed;border-collapse:collapse;font-size:13px}
.zt td{padding:8px 0;border-bottom:1px solid rgba(42,61,77,.5);vertical-align:top}
.zt tr:last-child td{border:none}
.zn{font-family:'Avenir Next Condensed',sans-serif;font-weight:600;padding-right:10px!important;line-height:1.25}
.zd{color:var(--haze);font-size:12px;line-height:1.35}
.zv{text-align:right;font-family:'Avenir Next Condensed',sans-serif;font-weight:600;color:var(--cold);width:88px;padding-left:8px!important;line-height:1.25;word-break:break-word}
.zh{color:var(--haze);font-size:11px}
.pr{font-size:13px;line-height:1.55;color:#C4D4DE;margin:0 0 11px}
.pr:last-child{margin-bottom:0}
.pr.note{font-size:11.5px;color:var(--haze)}
.pl{margin:0 0 11px;padding-left:20px;font-size:13px;line-height:1.55;color:#C4D4DE}
.pl li{margin-bottom:7px}
.testbtn{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:8px;font-size:13.5px;
 color:var(--snow);display:flex;align-items:center;justify-content:center}
.off{text-align:center;padding:46px 22px}
.off h2{font-family:'Avenir Next Condensed',sans-serif;font-size:25px;margin:0 0 8px;font-weight:600}
.off p{color:var(--haze);font-size:13.5px;margin:0;line-height:1.55}

.sum{margin-top:16px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.sum h3{font-size:14px;margin:0 0 9px;color:var(--haze);font-weight:600}
.sr{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid rgba(42,61,77,.5)}
.sr:last-child{border:none}
.sr b{font-family:'Avenir Next Condensed',sans-serif;font-size:15px;font-weight:600}

.notes{margin-top:12px;padding:13px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.nh{display:flex;width:100%;gap:10px;justify-content:space-between;align-items:center;font-size:12px;color:var(--haze);
 text-transform:uppercase;letter-spacing:.06em;min-height:24px}
.nh b{color:var(--warn);text-transform:none;letter-spacing:0;font-size:11.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.tg{border:1.5px solid var(--line);border-radius:20px;padding:9px 13px;font-size:12.5px;color:var(--haze);min-height:40px;display:flex;align-items:center}
.tg.on{border-color:var(--warn);background:rgba(226,130,90,.14);color:var(--warn)}
.nrow{display:flex;gap:8px;margin-top:11px;align-items:flex-end}
.nrow .fld{flex:0 0 110px}
.nrow input[type=text]{text-align:left;font-size:14px;font-weight:400}

.flag{margin-top:10px;padding:9px 11px;background:rgba(226,130,90,.12);border:1px solid rgba(226,130,90,.35);
 border-radius:8px;font-size:11.5px;color:var(--warn);line-height:1.4}
.info{margin-top:10px;padding:9px 11px;background:rgba(127,168,201,.1);border:1px solid rgba(127,168,201,.3);
 border-radius:8px;font-size:11.5px;color:var(--cold);line-height:1.4}

.tmr{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:560px;margin:0 auto;background:var(--panel2);
 border-top:1px solid var(--line);padding:11px 16px calc(11px + var(--sab));display:flex;align-items:center;gap:13px;
 transform:translateY(115%);transition:transform .22s}
.tmr.up{transform:none}
.tmr .cd{font-family:'Avenir Next Condensed',sans-serif;font-size:31px;font-weight:700;min-width:72px}
.tmr .cd.z{color:var(--beacon)}
.tmr .lb{flex:1;font-size:12px;color:var(--haze)}
.tmr button{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:12px 15px;min-height:44px;font-size:13px;font-weight:600}

.foot{padding:24px 16px 10px;display:flex;flex-direction:column;gap:10px;align-items:center}
.foot button{font-size:12px;color:#6E8A9C;text-decoration:underline}
.toast{position:fixed;left:50%;bottom:calc(80px + var(--sab));transform:translateX(-50%) translateY(20px);background:var(--panel2);
 border:1px solid var(--line);border-radius:8px;padding:10px 16px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:88%;text-align:center}
.toast.up{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="tmr" id="tmr"><div class="cd" id="cd">2:30</div><div class="lb" id="tlb">Rest</div><button onclick="stopT()">Dismiss</button></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   1. ATHLETE STATE — the only place athlete-specific numbers live.
   ============================================================ */
function seedAthlete(){return{
 bodyweightKg:84,
 e1RM:{squat:60.0, bench:52.0, benchVolume:52.0, rdl:null, legPress:null,
       bss:null, pullup:null, row:null},
 //     ^ bench: 40 kg x 8 @ RIR 1  ->  40*(1+9/30) = 52.0
 //       pullup e1RM is TOTAL weight moved (bodyweight minus assistance),
 //       so rising strength shows up as less assistance, then as added weight.
 aerobic:{currentWeeklyMinutes:120, capMinutes:480, aetBpm:120, antBpm:null},
 me:{peakPackKg:15, peakDurationMin:60},
 cycle:1, blockType:'general_strength',
 focus:['general_strength','aerobic_base','uphill_me'],
 trainingDays:[0,1,2,3,4]
};}

/* ============================================================
   2. SCHEDULE — sets / reps / RIR only. No kilograms anywhere.
   ============================================================
   Row = [sets, reps, targetRIR] with a 4th element 'D' for deload.
   3:1 structure — weeks 4 and 8 are deloads.                     */
const BLOCKS={
 general_strength:{growth:0.020, accessoryDrop:0, label:'General strength',
  squat:[[3,6,3],[3,6,3],[4,6,2],[2,6,4,'D'],[4,5,2],[4,4,1.5],[4,4,1],[2,4,4,'D']],
  rdl:  [[3,8,3],[3,8,3],[3,8,2],[2,8,4,'D'],[4,8,2],[4,7,1.5],[4,6,1],[2,6,4,'D']]},
 max_strength:{growth:0.015, accessoryDrop:1, label:'Max strength',
  squat:[[4,5,3],[4,5,3],[5,4,2],[2,5,4,'D'],[5,3,2],[5,3,1.5],[5,2,1],[2,3,4,'D']],
  rdl:  [[4,5,3],[4,5,3],[5,4,2],[2,5,4,'D'],[5,4,2],[5,3,1.5],[5,3,1],[2,3,4,'D']]},
 me_emphasis:{growth:0.010, accessoryDrop:1, label:'ME emphasis', packBonus:5,
  squat:[[3,6,3],[3,6,3],[3,6,2.5],[2,6,4,'D'],[3,5,2.5],[3,5,2],[3,5,2],[2,5,4,'D']],
  rdl:  [[3,8,3],[3,8,3],[3,8,2.5],[2,8,4,'D'],[3,8,2.5],[3,7,2],[3,7,2],[2,6,4,'D']]}
};
// Shared across block types
const FIXED={
 bench:      [[3,8,2.5],[3,9,2.5],[4,8,2],[2,8,4,'D'],[4,7,2],[4,6,1.5],[4,5,1],[2,5,4,'D']],
 benchVolume:[[3,10,3],[3,11,3],[4,10,2],[2,10,4,'D'],[4,11,2],[4,10,2],[4,11,1.5],[2,9,4,'D']],
 legPress:   [[3,10,3],[3,11,3],[3,12,2],[2,10,4,'D'],[3,8,2],[3,9,2],[3,10,1.5],[2,8,4,'D']],
 // Former accessories, now on the same engine. Reps are FIXED within each
 // half-cycle so progress reads as load moving, not as a rep range drifting.

/* ============================================================
   3. LOAD MODEL — kilograms are an OUTPUT, never an input.
   ============================================================ */
const pctOf1RM=(reps,rir)=>1/(1+(reps+rir)/30);
const isDeload=w=>w===4||w===8;
const floorTo=(v,inc)=>Math.max(inc,Math.floor(v/inc)*inc);
const roundTo=(v,inc)=>Math.max(inc,Math.round(v/inc)*inc);
const round5=v=>Math.round(v/5)*5;
const roundTo0=(v,inc)=>Math.round(v/inc)*inc;   // may be 0 or negative
let _cc=null,_ck='';
function comp(){const k=JSON.stringify(selection())+A.cycle+A.aerobic.antBpm;
 if(k!==_ck){_ck=k;_cc=compose();}return _cc;}
function invalidate(){_ck='';_wpk='';}
function slotsKey(){return JSON.stringify(LOG.slots||{});}
const blk=()=>{const c=comp();
 const base=BLOCKS[c.scheme]||BLOCKS.general_strength;
 return Object.assign({},base,{growth:c.growth!=null?c.growth:base.growth});};
function scheme(ex){
 const o=LOG.schedOverride&&LOG.schedOverride[ex];
 return o||blk()[ex]||FIXED[ex]||NEW_SCHED();
}
// Loading weeks completed BEFORE week w (deloads contribute nothing).
function growthWeeks(w){let n=0;for(let i=1;i<w;i++)if(!isDeload(i))n++;return n;}
const prevLoading=w=>w===4?3:w===8?7:null;

// One place that turns a raw target into a load you can actually set.
// Assisted machines snap the ASSISTANCE to the stack, not the load.
function snapLoad(ex,v,mode){
 const inc=LIB[ex].inc;
 if(LIB[ex].assisted){
  const bw=A.bodyweightKg;
  const a=(mode==='floor')?Math.ceil((bw-v)/inc)*inc:Math.round((bw-v)/inc)*inc;
  return bw-a;                       // negative assistance = added weight
 }
 return (mode==='floor')?floorTo(v,inc):roundTo(v,inc);
}
function mainLoad(ex,w){
 const e=A.e1RM[ex];
 if(e==null)return null;                       // find-the-load on first exposure
 const inc=LIB[ex].inc;
 if(isDeload(w)){                              // 90% of the preceding loading week
  const base=mainLoad(ex,prevLoading(w));
  return base==null?null:snapLoad(ex,base*0.9,'round');
 }
 const row=scheme(ex)[w-1];
 const projected=e*Math.pow(1+blk().growth,growthWeeks(w));
 let raw=projected*pctOf1RM(row[1],row[2]);
 if(ex==='legPress'&&ECC[w-1]>=4)raw*=ECC_RESET;   // 4 s eccentric transition
 let L=snapLoad(ex,raw,w===1?'floor':'round');   // conservative on first exposure
 // Guardrail: clamp any jump above 7.5% — measured against the previous LOADING
 // week, because a deload is deliberately light and must not drag the next block down.
 let p=w-1; while(p>=1&&isDeload(p))p--;
 if(p>=1){
  const pl=mainLoad(ex,p), rp=scheme(ex)[p-1], rw=scheme(ex)[w-1];
  // The clamp guards against overload, not against intensity. Moving from
  // 6 reps to 4 legitimately needs a big load step, so only clamp when the
  // rep scheme is unchanged — that is when a jump really means overload.
  const sameScheme=(rp[1]===rw[1]&&rp[2]===rw[2]);
  if(sameScheme&&pl!=null&&L>pl*1.075&&!(ex==='legPress'&&ECC[w-1]>=4&&ECC[p-1]<4)){
   // floor, not round — rounding up here would step straight past the cap
   L=snapLoad(ex,pl*1.075,'floor');
  }}
 return L;
}

/* e1RM update — EMA, with the spec's guardrails */
function inferredRir(tap,target){
 return tap==='had_more'?target+2 : tap==='on_target'?target
      : tap==='grindy'?Math.max(0,target-1) : 0;
}
function logE1rm(ex,w,d,from,to,tap,reps,load){
 LOG.e1rmLog=LOG.e1rmLog||[];
 const key=w+'-'+d+'-'+ex;
 const rec={key,week:w,day:d,ex,from:Math.round(from*10)/10,to:Math.round(to*10)/10,
            tap,reps:reps==null?null:reps,load,at:new Date().toISOString()};
 const i=LOG.e1rmLog.findIndex(x=>x.key===key);
 if(i>-1)LOG.e1rmLog[i]=rec;else LOG.e1rmLog.push(rec);
}
function updateE1RM(ex,w,tap,repsDone,dayIdx){
 if(isDeload(w))return;                        // deloads aren't informative
 const e=A.e1RM[ex]; if(e==null)return;
 const row=scheme(ex)[w-1], load=mainLoad(ex,w);
 if(load==null)return;
 const reps=(tap==='missed')?repsDone:row[1];
 const rir=inferredRir(tap,row[2]);
 if(reps+rir>15)return;                        // extrapolation unreliable
 const n=(LOG.sessionCount[ex]||0);
 const observed=load*(1+(reps+rir)/30);
 const alpha=n<3?0.5:0.25;
 const next=e*(1-alpha)+observed*alpha;
 LOG.e1rmPrev[ex]=e;
 A.e1RM[ex]=Math.round(next*10)/10;
 logE1rm(ex,w,dayIdx,e,next,tap,reps,load);
 LOG.sessionCount[ex]=n+1;
 if(ex==='bench')A.e1RM.benchVolume=A.e1RM.bench;      // same lift
 if(ex==='benchVolume')A.e1RM.bench=A.e1RM.benchVolume;
 checkGuardrails(ex,e,next,w);
}
function checkGuardrails(ex,before,after,w){
 if(after<before*0.93)
  LOG.alerts['decline-'+ex]='e1RM on '+LIB[ex].n.toLowerCase()+' fell more than 7%. Consider pulling the next deload forward.';
 const misses=Object.keys(LOG.feedback).filter(k=>LOG.feedback[k]&&LOG.feedback[k].tap==='missed'&&k.indexOf(w+'-')===0);
 if(new Set(misses.map(k=>k.split('-')[1])).size>=2)
  LOG.alerts['misses']='Missed reps on two different lifts this week. Consider pulling the next deload forward.';
}

/* ============================================================

   ============================================================
   RP's concurrent-training position is the binding constraint: you can
   progress one quality hard, partially progress a second, and only
   maintain a third. The weights below encode exactly that.            */
const RANK_W=[1.00,0.60,0.30];

// Weekly set landmarks, reduced from RP's standalone numbers because
// concurrent endurance work lowers recoverable volume.
const LANDMARK={lower:{mev:8,mav:13,mrv:16}, upper:{mev:8,mav:16,mrv:20}};
const LEG_CAP_WITH_ENDURANCE=12;

const FOCUS={

   upper:12,lower:12,growth:0.020,scheme:'general_strength',aero:1.10},
 max_strength:{n:'Max strength',fam:'strength',blurb:'Heavy, low reps. Raises the force ceiling everything else sits under.',
   upper:10,lower:10,growth:0.015,scheme:'max_strength',aero:1.10},
 general_ht:{n:'General hypertrophy',fam:'hypertrophy',blurb:'Balanced muscle gain, upper and lower.',
   upper:16,lower:13,growth:0.020,scheme:'general_strength',aero:1.10},

   upper:8,lower:9,growth:0.010,scheme:'me_emphasis',aero:1.10,needsME:1,meAgg:1.0},

   upper:8,lower:8,growth:0.010,scheme:'me_emphasis',aero:1.10,needsLong:1},

   upper:8,lower:8,growth:0.010,scheme:'general_strength',aero:1.10},

   upper:8,lower:8,growth:0.010,scheme:'general_strength',aero:1.05,needsIntervals:1,needsAnT:1},
 maintenance:{n:'Maintenance / in-season',fam:'special',blurb:'Hold what you have while the mountain takes the load.',
   upper:8,lower:8,growth:0.000,scheme:'general_strength',aero:1.00,noP1:1},
 resensitization:{n:'Resensitization',fam:'special',blurb:'Two to three weeks at low volume to restore your response to training.',
   upper:6,lower:6,growth:0.000,scheme:'general_strength',aero:0.70,exclusive:1,mev:6},
 durability:{n:'Durability',fam:'special',blurb:'Eccentrics, ankles and knees. The tissue that fails on descents.',
   upper:8,lower:12,growth:0.010,scheme:'general_strength',aero:1.10,needsDurability:1}
};
const FOCUS_ORDER=['general_strength','max_strength','general_ht','upper_ht','lower_ht',
 'uphill_me','long_aerobic','aerobic_base','peak_aerobic','durability','maintenance','resensitization'];
const FAM_LABEL={strength:'Strength',hypertrophy:'Hypertrophy',endurance:'Endurance',special:'Special phases'};

const DEFAULT_FOCUS=['general_strength','aerobic_base','uphill_me'];
// Array.isArray, not truthiness — an empty array means "the user cleared it",
// which is different from "never set" and must not silently restore defaults.
function selection(){return Array.isArray(A.focus)?A.focus:DEFAULT_FOCUS.slice();}

function conflicts(sel){
 const out=[], rank=id=>sel.indexOf(id), has=id=>rank(id)>-1, top2=id=>{const r=rank(id);return r===0||r===1;};
 if(has('resensitization')&&sel.length>1)
  out.push({t:'block',m:'Resensitization is a standalone phase — its whole purpose is removing stimulus. Run it alone.'});
 if(rank('maintenance')===0)
  out.push({t:'block',m:'Maintenance cannot be your first priority. It is defined as holding, not building — rank it second or third.'});
 if(top2('peak_aerobic')&&(top2('general_ht')||top2('upper_ht')||top2('lower_ht')))
  out.push({t:'warn',m:'High interference: hard intervals and hypertrophy compete for the same recovery. Keep at least 6 hours between them, and never intervals on a leg day.'});
 if(has('peak_aerobic')&&!A.aerobic.antBpm)
  out.push({t:'warn',m:'No anaerobic threshold set, so interval targets will use duration and perceived effort with heart rate as a guardrail only. Test AnT in Thresholds & tests for proper zones.'});
 if(has('peak_aerobic')&&A.cycle===1)
  out.push({t:'warn',m:'Uphill Athlete sequences base before intensity. Peak capacity in a first cycle usually sharpens a base that is not there yet.'});
 if(rank('uphill_me')===0&&A.cycle===1)
  out.push({t:'warn',m:'Max strength normally precedes muscular endurance. ME built on an undeveloped force ceiling trains you to be efficient at being weak.'});
 if(qualityCount(sel)>=3)
  out.push({t:'warn',m:'That is three hard sessions a week on top of two strength days. Something will go under-recovered — consider dropping one to a later cycle.'});
 if(top2('lower_ht')&&top2('uphill_me'))
  out.push({t:'warn',m:'Lower-body hypertrophy and uphill ME load the same tissue. Combined leg volume is capped at '+LEG_CAP_WITH_ENDURANCE+' sets a week.'});
 return out;
}

function compose(sel){
 sel=sel||selection();
 const unset=!sel.length;
 if(unset)sel=['general_strength'];      // engine needs something; UI shows it as unset
 const C={focuses:[],upper:0,lower:0,growth:0,scheme:'general_strength',
   me:{present:0,agg:0},aero:{growth:1.10,long:0,intervals:0},warnings:conflicts(sel),
   mev:LANDMARK.lower.mev, endurTop2:0};
 sel.forEach((id,i)=>{
  const f=FOCUS[id]; if(!f)return;
  const w=RANK_W[i]!=null?RANK_W[i]:0.30;
  C.focuses.push({id,rank:i+1,weight:w,name:f.n,fam:f.fam});
  C.upper=Math.max(C.upper,(f.upper||0)*w);
  C.lower=Math.max(C.lower,(f.lower||0)*w);
  if(i===0){C.scheme=f.scheme; C.growth=f.growth; C.aero.growth=f.aero;}
  else{C.growth=Math.max(C.growth,f.growth*w);}
  if(f.needsME){C.me.present=1; C.me.agg=Math.max(C.me.agg,w);}
  if(f.needsLong)C.aero.long=1;
  if(f.needsIntervals)C.aero.intervals=1;
  if(f.needsDurability)C.durability=1;
  if(f.mev)C.mev=f.mev;
  if(f.fam==='endurance'&&i<2)C.endurTop2=1;
 });
 // floors, ceilings and the leg cap
 const lo=LANDMARK.lower, up=LANDMARK.upper;
 let legMax=C.endurTop2?LEG_CAP_WITH_ENDURANCE:lo.mrv;
 if(sel.indexOf('lower_ht')>-1&&sel.indexOf('uphill_me')>-1)legMax=Math.min(legMax,LEG_CAP_WITH_ENDURANCE);
 C.lower=Math.round(Math.min(Math.max(C.lower,C.mev),legMax));
 C.upper=Math.round(Math.min(Math.max(C.upper,C.mev),up.mrv));
 C.blocked=C.warnings.some(x=>x.t==='block'); C.unset=unset;
 return C;
}

/* ============================================================
   3b. HEART-RATE ZONES — derived from two anchors, never hardcoded.
   ============================================================
   Z1/Z2 need only AeT. Z3+ need AnT; without it they stay undefined
   and intensity work falls back to duration and perceived effort.  */
function zones(){
 const aet=A.aerobic.aetBpm, ant=A.aerobic.antBpm;
 const z={z1:[0,aet-10], z2:[aet-10,aet]};
 if(ant&&ant>aet){z.z3=[aet,ant]; z.z4=[ant,ant+5]; z.z5=[ant+5,null];}
 return z;
}
const zText=r=>!r?'—':(r[0]<=0?'≤'+r[1]:(r[1]==null?r[0]+'+':r[0]+'–'+r[1]));
// Session bands, all expressed against the anchors
function band(kind,deload){
 const aet=A.aerobic.aetBpm;
 if(kind==='recovery')return{lo:0,hi:aet-10,txt:'≤'+(aet-10)};
 if(kind==='base')return deload?{lo:0,hi:aet-10,txt:'≤'+(aet-10)}
                              :{lo:aet-10,hi:aet,txt:(aet-10)+'–'+aet};
 if(kind==='me')return deload?{lo:aet-15,hi:aet-5,txt:(aet-15)+'–'+(aet-5)}
                            :{lo:aet-15,hi:aet+5,txt:(aet-15)+'–'+(aet+5)};
 return{lo:0,hi:aet,txt:'≤'+aet};
}
function thresholdWarning(){
 const {aetBpm:aet,antBpm:ant}=A.aerobic;
 if(!ant)return null;
 if(ant<=aet)return 'Your anaerobic threshold is at or below your aerobic threshold. One of the two tests is wrong — retest before trusting any zone above Z2.';
 if(ant-aet<10)return 'Only '+(ant-aet)+' bpm between your thresholds. That is unusually narrow and normally means the AeT test drifted high. Worth retesting.';
 return null;
}

/* ============================================================
   4. AEROBIC — algorithmic, not tabular.
   ============================================================ */
function aerobicPlan(){
 const cap=A.aerobic.capMinutes;
 const seed=Math.min(A.aerobic.currentWeeklyMinutes*1.5, A.aerobic.currentWeeklyMinutes+90);
 const out=[]; let lastLoading=round5(seed);
 for(let w=1;w<=8;w++){
  if(w===1){out.push(lastLoading);continue;}
  if(w%4===0){out.push(round5(lastLoading*0.65));continue;}   // step-back
  const next=Math.min(round5(lastLoading*1.10),cap);
  out.push(next); lastLoading=next;
 }
 return out;
}
// Allocate the weekly aerobic budget across whatever day roles exist this
// cycle. Intervals take a fixed structured duration; a long day may take up
// to half the week (that is its purpose); everything else shares the rest.
function aerobicSplit(w){
 const total=aerobicPlan()[w-1], days=DAYS_NOW(), out={total:total,byDay:{}};
 const iv=days.find(d=>d.type==='intervals'), lg=days.find(d=>d.type==='long');
 const plain=days.filter(d=>d.type==='aerobic');
 const strength=days.filter(d=>d.type==='strength');
 let left=total;
 if(iv){const I=INTERVAL_WK[w-1];
  const mins=round5(20+I.reps*(I.work+I.rec)+10);   // warm-up + work + cool-down
  out.byDay[iv.dow]=mins; left-=mins;}
 // afternoon easy sessions on lifting days
 const pmEach=round5(Math.min(left*0.16,(total>=260?85:75)));
 strength.forEach(d=>{out.byDay['pm'+d.dow]=Math.max(0,isDeload(w)?0:pmEach); if(!isDeload(w))left-=pmEach;});
 if(lg){const cap=Math.floor(total*(isDeload(w)?0.40:0.50));
  const mins=Math.min(round5(left*0.55),cap); out.byDay[lg.dow]=mins; left-=mins;}
 if(plain.length){const each=round5(left/plain.length);
  plain.forEach((d,i)=>{out.byDay[d.dow]=(i===plain.length-1)?Math.max(0,left-each*(plain.length-1)):each;});}
 else if(left>0&&lg){out.byDay[lg.dow]+=left;}
 else if(left>0&&iv){out.byDay[iv.dow]+=left;}
 return out;
}
const aerobicOf=(w,d)=>aerobicSplit(w).byDay[d]||0;
const pmOf=(w,d)=>aerobicSplit(w).byDay['pm'+d]||0;

/* ============================================================
   4b. GENERATED WEEK — day layout follows the focus composition.
   ============================================================ */
// Intervals scale with the cycle. Work is in minutes per rep.
const INTERVAL_WK=[
 {reps:4,work:3,rec:3,z:'z3',n:'Introductory. Controlled, not maximal.'},
 {reps:5,work:3,rec:3,z:'z3',n:''},
 {reps:5,work:4,rec:3,z:'z4',n:'First work at threshold.'},
 {reps:3,work:3,rec:3,z:'z3',n:'Deload. Keep it comfortably short.',deload:1},
 {reps:4,work:5,rec:3,z:'z4',n:''},
 {reps:5,work:5,rec:3,z:'z4',n:''},
 {reps:6,work:4,rec:2,z:'z4',n:'Peak session. Shorter recoveries.'},
 {reps:3,work:3,rec:3,z:'z3',n:'Deload.',deload:1}
];
// Durability: joint and tissue work, bodyweight or light. No load tracking.
const DURABILITY=[
 {n:'Eccentric calf raise',d:'3×12 · 4 s lowering, off a step'},
 {n:'Tibialis raise',d:'3×15 · toes up, heels on the floor'},
 {n:'Step-down',d:'3×8 per leg · slow, knee tracking over the foot'},
 {n:'Copenhagen plank',d:'2×20 s per side · build gradually'}
];

// How many quality (hard) sessions the composition asks for.
// ME, intervals and a long day are all hard sessions. Three of them on top of
// two strength days is five quality sessions a week, which nothing recovers from.
function qualityCount(sel){return ['uphill_me','peak_aerobic','long_aerobic']
 .reduce((n,id)=>n+(sel.indexOf(id)>-1?1:0),0);}

// The week, generated. Mon/Wed stay the strength anchors; Tue/Thu/Fri
// take whatever quality work the focus needs.
const MIN_DAYS=5;
function trainingDays(){
 const t=A.trainingDays;
 return (Array.isArray(t)&&t.length>=MIN_DAYS)?t.slice().sort((a,b)=>a-b):[0,1,2,3,4];
}
// Roles are assigned by position, not by weekday, so the same logic works
// whatever days you pick: strength first and middle, ME last, intervals
// earliest, long day next. With Mon-Fri this reproduces the classic layout.
function weekPlan(){
 const C=comp(), sel=trainingDays(), n=sel.length;
 const allEndurance=selection().length>=2&&selection().every(id=>FOCUS[id]&&FOCUS[id].fam==='endurance');
 const nStrength=allEndurance?1:2;
 const role={};
 const s1=sel[0]; role[s1]='A';

 if(nStrength===2){const mid=Math.floor(n/2), s2=sel[mid]!=null&&sel[mid]!==s1?sel[mid]:rem[rem.length-1];

function cardioFields(k,c,cap){

 return '<div class="flds"><div class="fld"><label>Minutes</label><input type="number" inputmode="numeric" data-c="'+k+'" data-f="min" value="'+(c.min??'')+'" placeholder="—"></div>'+

 '<div class="flds"><div class="fld"><label>Distance km</label><input type="number" step="0.1" inputmode="decimal" data-c="'+k+'" data-f="dist" value="'+(c.dist??'')+'" placeholder="—"></div>'+
 '<div class="fld"><label>Incline %</label><input type="number" step="0.5" inputmode="decimal" data-c="'+k+'" data-f="inc" value="'+(c.inc??'')+'" placeholder="—"></div>'+
 '<div class="fld"><label>Vertical m</label><input type="number" inputmode="numeric" data-c="'+k+'" data-f="dv" value="'+(c.dv??'')+'" placeholder="—"></div></div>'+
 (derived!=null&&c.dv===derived?'<div class="hint">Vertical worked out from your distance and incline. Overwrite it if your treadmill reports something different.</div>':'')+
 (over?'<div class="flag">Averaged '+(c.hr-cap)+' bpm above the ceiling — that made this a moderate session, not a base one.</div>':'');
}

  A.trainingDays=cur.sort((x,y)=>x-y); invalidate(); save(); render();
 });
 document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
  const id=b.dataset.pick, sel=selection().slice(), i=sel.indexOf(id);
  if(i>-1){sel.splice(i,1);}
  else{
   if(sel.length>=3){toast('Three is the limit — remove one first');return;}
   sel.push(id);
   const c=compose(sel);
   const blockers=c.warnings.filter(x=>x.t==='block');
   if(blockers.length){toast(blockers[0].m.split('.')[0]);return;}
  }
  if(!confirmReshape('your focus'))return;
  A.focus=sel; invalidate(); save(); render();
 });
 document.querySelectorAll('[data-drop]').forEach(b=>b.onclick=()=>{
  if(!confirmReshape('your focus'))return;
  const sel=selection().filter(x=>x!==b.dataset.drop);
  A.focus=sel; invalidate(); save(); render();
 });
 document.querySelectorAll('[data-tests]').forEach(b=>b.onclick=()=>{UI.screen='tests';render();});
 document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{UI.screen=null;render();});
 document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{
  const which=b.dataset.set, cur=which==='aet'?A.aerobic.aetBpm:A.aerobic.antBpm;
  const v=prompt(which==='aet'?'Aerobic threshold, bpm — the highest HR you held for 60 min with under 5% drift'
                              :'Anaerobic threshold, bpm — average HR of the last 20 min of a 30 min time trial\n\nLeave blank to clear.',
                 cur??'');
  if(v===null)return;
  const t=v.trim();
  if(t===''){ if(which==='ant'){A.aerobic.antBpm=null;recordThreshold();invalidate();save();render();toast('AnT cleared');} return; }
  const n=parseInt(t,10);
  if(isNaN(n)||n<60||n>220){toast('Enter a heart rate between 60 and 220');return;}
  if(which==='aet')A.aerobic.aetBpm=n; else A.aerobic.antBpm=n;
  recordThreshold(); invalidate(); save(); render();
  const wn=thresholdWarning();
  toast(wn?'Saved — but check the warning':'Saved. All zones recalculated.');
 });
 document.querySelectorAll('.pk').forEach(b=>b.onclick=()=>{LOG.pos.w=+b.dataset.w;save();render();});
 document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{LOG.pos.d=+b.dataset.d;save();render();});
 document.querySelectorAll('[data-clr]').forEach(b=>b.onclick=()=>{delete LOG.alerts[b.dataset.clr];save();render();});
 document.querySelectorAll('.pip').forEach(b=>b.onclick=()=>{const was=on(b.dataset.k);tog(b.dataset.k);
  if(!was&&+b.dataset.rest)startT(+b.dataset.rest,'Rest · '+b.dataset.nm);});
 document.querySelectorAll('.ssb,.mark').forEach(b=>b.onclick=()=>tog(b.dataset.k));
 document.querySelectorAll('.eb').forEach(b=>b.onclick=()=>{
  const ex=b.closest('.ex').querySelector('[data-find]').dataset.find, tap=b.dataset.eff, key=SK(w,d)+'-'+ex;
  if(LOG.feedback[key]&&LOG.feedback[key].tap===tap)return;
  let reps=null;
  if(tap==='missed'){
   const row=scheme(ex)?scheme(ex)[w-1]:null;
   const v=prompt('How many reps did you actually complete on the last set?',row?row[1]-1:'');
   if(v===null)return; reps=parseInt(v,10);
   if(isNaN(reps)||reps<0){toast('Need a number of reps');return;}
  }
  // recompute from the pre-feedback estimate so changing your mind replaces, never stacks
  if(LOG.feedback[key]&&LOG.e1rmPrev[ex]!=null){A.e1RM[ex]=LOG.e1rmPrev[ex];
   LOG.sessionCount[ex]=Math.max(0,(LOG.sessionCount[ex]||1)-1);
   if(ex==='bench')A.e1RM.benchVolume=A.e1RM.bench; if(ex==='benchVolume')A.e1RM.bench=A.e1RM.benchVolume;}
  LOG.feedback[key]={tap,reps};
  updateE1RM(ex,w,tap,reps,d);
  save();render();
  toast(isDeload(w)?'Logged — deload weeks do not move your estimate'
   :'Estimated 1RM now '+(A.e1RM[ex]?A.e1RM[ex].toFixed(1)+' kg':'—'));
 });
 document.querySelectorAll('[data-find]').forEach(b=>b.onclick=()=>{
  const ex=b.dataset.find,L=LIB[ex],row=scheme(ex)[w-1],bw=A.bodyweightKg;
  let effective;
  if(L.assisted){
   const curLoad=mainLoad(ex,w), curAssist=curLoad==null?'':bw-curLoad;
   const v=prompt('Assisted pull-up — assistance actually used, kg.\n\n'+
     'Enter 0 for unassisted, or a negative number for added weight.', curAssist);
   if(v===null)return; const a=parseFloat(v);
   if(isNaN(a)){toast('Need a number');return;}
   effective=bw-roundTo0(a,L.inc);
   if(effective<=0){toast('That is more assistance than your bodyweight');return;}
  }else{
   const v=prompt(L.n+' — load actually used, kg', mainLoad(ex,w)??'');
   if(v===null)return; const n=parseFloat(v);
   if(isNaN(n)||n<=0){toast('Need a weight in kg');return;}
   effective=roundTo(n,L.inc||2.5);
  }
  A.e1RM[ex]=Math.round(effective*(1+(row[1]+row[2])/30)*10)/10;
  if(ex==='bench')A.e1RM.benchVolume=A.e1RM.bench;
  if(ex==='benchVolume')A.e1RM.bench=A.e1RM.benchVolume;
  save();render();
  toast(L.assisted?('Assistance set to '+(bw-effective)+' kg'):('Set to '+effective+' kg'));
 });
 document.querySelectorAll('[data-c]').forEach(el=>el.onchange=()=>{
  touch();const k=el.dataset.c,f=el.dataset.f;LOG.cardio[k]=LOG.cardio[k]||{};
  const v=parseFloat(el.value);
  if(isNaN(v))delete LOG.cardio[k][f];else LOG.cardio[k][f]=v;
  // distance x incline x 10 = vertical metres; typing vertical directly wins
  if(f==='dist'||f==='inc'){const o=LOG.cardio[k];
   if(o.dist&&o.inc)o.dv=Math.round(o.dist*o.inc*10);}
  save(); render();});
 document.querySelectorAll('[data-me]').forEach(el=>el.onchange=()=>{
  touch();const k=el.dataset.me,f=el.dataset.f;LOG.me[k]=LOG.me[k]||{};
  const v=parseFloat(el.value);
  if(isNaN(v))delete LOG.me[k][f];else LOG.me[k][f]=v;
  if(f==='dist'||f==='inc'){const o=LOG.me[k];
   if(o.dist&&o.inc)o.vert=Math.round(o.dist*o.inc*10);}
  save(); render();});
 document.querySelectorAll('[data-lim]').forEach(b=>b.onclick=()=>{
  const k=b.dataset.lim;LOG.me[k]=LOG.me[k]||{};LOG.me[k].limiter=b.dataset.v;save();render();});
 document.querySelectorAll('[data-notes]').forEach(b=>b.onclick=()=>{UI.notes=!UI.notes;render();});
 document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{
  touch();const sk=SK(w,d),cur=LOG.tags[sk]||[],x=b.dataset.tag,i=cur.indexOf(x);
  if(i>-1)cur.splice(i,1);else cur.push(x);
  LOG.tags[sk]=cur;UI.notes=1;save();render();});
 document.querySelectorAll('[data-mhr]').forEach(el=>el.onchange=()=>{
  const v=parseInt(el.value,10);
  if(isNaN(v))delete LOG.morningHr[el.dataset.mhr];else LOG.morningHr[el.dataset.mhr]=v;save();});
 document.querySelectorAll('[data-note]').forEach(el=>el.onchange=()=>{
  const v=el.value.trim();
  if(!v)delete LOG.note[el.dataset.note];else LOG.note[el.dataset.note]=v;save();});
}

/* ============================================================
   8. CYCLE ROLLOVER
   ============================================================ */
function rollover(){
 const nextType=A.blockType==='general_strength'?'max_strength':'general_strength';
 if(!confirm('Finish cycle '+A.cycle+'?\n\nEstimated maxes carry forward. Aerobic reseeds from week 7. '+
   'ME peak grows. Next block type: '+BLOCKS[nextType].label+'.\n\nThis clears the current cycle log.'))return;
 LOG.history.push({cycle:A.cycle,blockType:A.blockType,e1RM:Object.assign({},A.e1RM),
  tags:Object.assign({},LOG.tags),note:Object.assign({},LOG.note),
  morningHr:Object.assign({},LOG.morningHr),dates:Object.assign({},LOG.dates),
  cardio:Object.assign({},LOG.cardio),me:Object.assign({},LOG.me),
  e1rmLog:(LOG.e1rmLog||[]).slice(),at:new Date().toISOString()});
 A.aerobic.currentWeeklyMinutes=aerobicPlan()[6];              // week 7, the last loading week
 A.me.peakPackKg=Math.min(A.me.peakPackKg+3,Math.round(A.bodyweightKg*0.25));
 A.me.peakDurationMin=Math.min(A.me.peakDurationMin+5,90);
 A.cycle+=1; A.blockType=nextType; invalidate();
 LOG.done={};LOG.feedback={};LOG.found={};LOG.sessionCount={};LOG.e1rmPrev={};
 LOG.cardio={};LOG.me={};LOG.tags={};LOG.note={};LOG.morningHr={};LOG.alerts={};
 LOG.e1rmLog=[];LOG.dates={};
 LOG.pos={w:1,d:0};
 save();render();toast('Cycle '+A.cycle+' ready — '+BLOCKS[nextType].label);
}
function recordThreshold(){
 LOG.thresholds=LOG.thresholds||[];
 const aet=A.aerobic.aetBpm, ant=A.aerobic.antBpm, date=new Date().toISOString().slice(0,10);
 const last=LOG.thresholds[LOG.thresholds.length-1];
 if(last&&last.aet===aet&&last.ant===ant)return;             // nothing actually changed
 const rec={date,aet,ant:ant||null,gap:ant?ant-aet:null};
 if(last&&last.date===date)LOG.thresholds[LOG.thresholds.length-1]=rec;   // one entry per day
 else LOG.thresholds.push(rec);
}
function backup(){
 const blob=new Blob([JSON.stringify({app:'skimo',v:2,saved:new Date().toISOString(),log:LOG},null,1)],{type:'application/json'});
 const f=new File([blob],'skimo-backup-'+new Date().toISOString().slice(0,10)+'.json',{type:'application/json'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Skimo backup'}).catch(()=>{});return;}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name;a.click();
}
function restore(){
 const inp=document.createElement('input');inp.type='file';inp.accept='application/json';
 inp.onchange=()=>{const fr=new FileReader();
  fr.onload=()=>{try{const dd=JSON.parse(fr.result);
   if(!dd||!dd.log||typeof dd.log!=='object'||Array.isArray(dd.log))throw 0;
   LOG=Object.assign(freshLog(),dd.log); A=LOG.athlete=Object.assign(seedAthlete(),dd.log.athlete||{}); applyCustom(); invalidate();
   save();render();toast('Restored — cycle '+A.cycle+', week '+LOG.pos.w);}
   catch(e){toast("That file isn't a Skimo backup");}};
  fr.readAsText(inp.files[0]);};
 inp.click();
}
function wipe(){if(confirm('Clear everything and reseed from your starting numbers?')){
 const hist=LOG.history;LOG=freshLog();LOG.history=hist;A=LOG.athlete;invalidate();save();render();toast('Reset to cycle 1, week 1');}}

(async function(){
 const s=await dbGet('log2');
 if(s){LOG=Object.assign(freshLog(),s);A=LOG.athlete=Object.assign(seedAthlete(),s.athlete||{});}
 applyCustom(); invalidate();
 render();
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
